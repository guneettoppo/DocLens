app = "doclens"

[build]
  builder = "docker"

[env]
  NODE_ENV = "production"

[[services]]
  http_checks = []
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.concurrency]]
    hard_limit = 50
    soft_limit = 25
    type = "connections"

  [[services.tom_checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/"
    timeout = "5s"
    type = "http"
